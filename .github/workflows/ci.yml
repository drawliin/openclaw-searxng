name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Check npm package contents
        run: npm pack --dry-run
